<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Application</title>
    <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"> -->
    <link href="/static/css/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/calendar.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="calendarTitle">Leave Application System</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                {% if is_logged_in %}
                <a href="/dashboard" class="login-btn" style="text-decoration: none;">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
                <span class="login-btn" style="background: #28a745; cursor: default;">
                    <i class="fas fa-user-check"></i>
                    {{ employee_name }}
                </span>
                {% else %}
                <button class="login-btn" onclick="openModal()">
                    <i class="fas fa-user"></i>
                    Login
                </button>
                {% endif %}
            </div>
        </div>

        <div class="calendar-container">
            <!-- Navigation and Month -->
            <div class="controls">
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="previousMonth()"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-btn" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
                    <button class="today-btn" onclick="goToToday()"><i class="fas fa-calendar-day"></i> Today</button>
                </div>
                
                <div class="calendar-header" id="monthYear"></div>
                
                <div class="view-toggle">
                    <button class="view-btn active" onclick="switchView('calendar')"><i class="fas fa-calendar"></i> Calendar</button>
                    <button class="view-btn" onclick="switchView('list')"><i class="fas fa-list"></i> List View</button>
                </div>
            </div>

            <!-- Calendar Grid -->
            <div id="calendarView">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div id="listView" class="list-view">
                <div class="loading" id="listLoading">
                    <i class="fas fa-spinner"></i> Loading leave records...
                </div>
                <div id="leaveList"></div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    {% if not is_logged_in %}
    <div class="modal" id="loginModal" {% if messages %}data-login-error="1"{% endif %}>
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Login</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form action="/login" method="POST">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="margin: 10px 0;">
                    <i class="fas fa-exclamation-circle"></i> {{ message }}
                </div>
                {% endfor %}

                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-input" id="username" name="username" required
                        value="{{ request.form.username if request.form.username else '' }}">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" class="form-input" id="password" name="password" required>
                        <i class="fas fa-eye" id="togglePassword"
                        style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function () {
                    passwordInput.type =
                        passwordInput.type === 'password' ? 'text' : 'password';
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            window.openModal = () => {
                document.getElementById('loginModal').classList.add('active');
            };

            window.closeModal = () => {
                document.getElementById('loginModal').classList.remove('active');
            };

            const loginModal = document.getElementById('loginModal');
            if (loginModal && loginModal.dataset.loginError === '1') {
                loginModal.classList.add('active');
            }
        });
    </script>
    {% endif %}

    <script src="static/js/calendar.js"></script>
</body>
</html>
